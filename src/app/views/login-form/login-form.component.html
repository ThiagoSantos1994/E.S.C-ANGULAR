<!-- Template Angular: login-form.component.html -->
<section class="vh-100 login-page">
    <div class="container-fluid h-custom login-container">
        <div class="row d-flex justify-content-center align-items-center h-100 login-content"
            style="background-color: #677171;">
            <div class="col-md-9 col-lg-6 col-xl-5 login-illustration-column">
                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
                    class="img-fluid" alt="Sample image">
            </div>
            <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1 login-form-column">
                <form [formGroup]="loginForm" (submit)="login()">
                    <div class="right-content">
                        <h3 class="form-title" style="color: azure;">Olá, seja bem-vindo!</h3>
                        <h6 class="form-title" style="color: rgb(255, 255, 255);">Digite seu usuario e senha para fazer
                            login.</h6>
                    </div>

                    <div data-mdb-input-init class="form-group form-outline mb-4">
                        <div class="input-group form-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fa fa-user"></i></span>
                            </div>
                            <input type="email" formControlName="userName" id="userName"
                                class="form-control form-control-lg" placeholder="Digite o usuario" />
                        </div>
                        <app-vmessage
                            *ngIf="(submitted || loginForm.get('userName').dirty) && loginForm.get('userName').errors?.required"
                            text='Usuario é obrigatório!'>
                        </app-vmessage>
                    </div>

                    <div data-mdb-input-init class="form-group form-outline mb-3">
                        <div class="input-group form-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fa fa-key"></i></span>
                            </div>
                            <input type="password" formControlName="password" id="password"
                                class="form-control form-control-lg" placeholder="Digite a senha" />
                        </div>
                        <app-vmessage
                            *ngIf="(submitted || loginForm.get('password').dirty) && loginForm.get('password').errors?.required"
                            text='Senha é obrigatório!'>
                        </app-vmessage>
                    </div>

                    <div *ngIf="!validacaoLogin">
                        <span class="alert alert-danger" style="float:right;width:100%;">Usuario e\ou Senha
                            Inválidos!</span>
                    </div>

                    <!--<div class="right-content">
                            <h6 class="form-title" style="color: azure;">
                                <input type="checkbox" formControlName="checkMantenhaMeConectado"
                                    id="chkMantenhaMeConectado">
                                <label class="form-check-label" for="chkMantenhaMeConectado" style="padding-left: 2%;">
                                    Mantenha-me conectado</label>
                            </h6>
                        </div>-->

                    <div class="text-center text-lg-start mt-4 pt-2">
                        <button type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg"
                            style="padding-left: 2.5rem; padding-right: 2.5rem;">Entrar</button>
                    </div>


                </form>
            </div>
        </div>
    </div>
    <div
        class="d-flex flex-column flex-md-row text-center text-md-start justify-content-between py-4 px-4 px-xl-5 bg-primary login-footer">
        <div class="text-white mb-3 mb-md-0">
            Copyright © 2016 - 2026. Todos os direitos reservados a Thiago Santos.
        </div>
    </div>
</section>
